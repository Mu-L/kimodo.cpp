<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kimodo quantization comparison</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;--bg:#080b0f;--panel:#10151b;--line:#25313b;--text:#f3f6f4;--muted:#8b9aa5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}main{display:grid;grid-template-columns:360px 1fr;width:100vw;height:100vh}.side{padding:20px;overflow:auto;background:var(--panel);border-right:1px solid var(--line)}h1{font-size:1.45rem;margin:0 0 4px}.hint,.metric{color:var(--muted);font-size:.84rem}.card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:14px;background:#151c23}label{display:block;margin:8px 0}select,input{width:100%;background:#0b1015;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}.variant{display:flex;align-items:center;gap:9px}.variant input{width:auto}.swatch{width:12px;height:12px;border-radius:50%}.metric{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:8px}.stage{min-width:0;display:flex;flex-direction:column}canvas{width:100%;height:100%;min-height:0;flex:1;background:radial-gradient(circle at 50% 25%,#102632,#090d12 58%);cursor:grab}.controls{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}button{border:0;border-radius:7px;padding:9px 14px;font-weight:700;background:#65eee1;color:#051013}#frame{flex:1}.error{color:#ff8f9b}@media(max-width:800px){body{overflow:auto}main{grid-template-columns:1fr;height:auto}.stage{height:70vh}}
</style></head><body><main><aside class="side"><h1>Quantization overlay</h1><div class="hint">Same prompt, exact diffusion noise and synchronized frames.</div><div class="card"><label>Comparison<select id="case"></select></label><label>Alignment<select id="alignment"><option value="world">World space</option><option value="root">Root-position aligned</option></select></label><label>Overlay opacity<input id="opacity" type="range" min="0.15" max="1" step="0.05" value="0.8"></label></div><div class="card"><strong>Variants</strong><div id="variants"></div></div><div class="card"><strong>Prompt</strong><p id="prompt" class="hint"></p></div><div class="card"><strong>Current divergence</strong><div id="metrics" class="metric"></div></div><p id="status" class="hint">Loading comparisons…</p></aside><section class="stage"><canvas id="view" width="1280" height="720"></canvas><div class="controls"><button id="play">Pause</button><input id="frame" type="range" min="0" value="0" step="1"><span id="frameText" class="hint"></span></div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#view'),ctx=canvas.getContext('2d'),caseSelect=$('#case'),variantBox=$('#variants'),frameSlider=$('#frame');let cases=[],comparison,streams=[],frame=0,playing=true,last=0,yaw=-.65,pitch=-.18,zoom=520,drag;
function qmul(a,b){return[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]]}
function rotate(q,v){const t=[2*(q[1]*v[2]-q[2]*v[1]),2*(q[2]*v[0]-q[0]*v[2]),2*(q[0]*v[1]-q[1]*v[0])];return[v[0]+q[3]*t[0]+q[1]*t[2]-q[2]*t[1],v[1]+q[3]*t[1]+q[2]*t[0]-q[0]*t[2],v[2]+q[3]*t[2]+q[0]*t[1]-q[1]*t[0]]}
function pose(s){const sk=comparison.skeleton,j=sk.parents.length,p=[],w=[],base=$('#alignment').value==='root'?[0,0,0]:Array.from(s.root.slice(frame*3,frame*3+3));for(let i=0;i<j;i++){let q=Array.from(s.rot.slice((frame*j+i)*4,(frame*j+i+1)*4)),n=Math.hypot(...q)||1;q=q.map(x=>x/n);const parent=sk.parents[i];if(parent<0){w[i]=q;p[i]=base}else{w[i]=qmul(w[parent],q);const o=rotate(w[parent],sk.offsets[i]);p[i]=p[parent].map((x,k)=>x+o[k])}}return p}
function project(v,center){let x=v[0]-center[0],y=v[1]-.8,z=v[2]-center[2],cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),xx=cy*x-sy*z,zz=sy*x+cy*z,yy=cp*y-sp*zz;return[canvas.width/2+xx*zoom,canvas.height*.58-yy*zoom]}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!comparison)return;const ref=streams[0],center=$('#alignment').value==='world'?[ref.root[frame*3],0,ref.root[frame*3+2]]:[0,0,0];ctx.globalAlpha=.35;ctx.strokeStyle='#24505a';ctx.lineWidth=1;for(let i=-10;i<=10;i++){let a=project([i*.5,0,-5],center),b=project([i*.5,0,5],center);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();a=project([-5,0,i*.5],center);b=project([5,0,i*.5],center);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}for(const s of streams){if(!s.visible)continue;const p=pose(s);ctx.globalAlpha=s===ref?1:Number($('#opacity').value);ctx.strokeStyle=s.color;ctx.lineWidth=s===ref?7:4;for(let i=1;i<p.length;i++){const a=project(p[i],center),b=project(p[comparison.skeleton.parents[i]],center);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}for(const v of p){const a=project(v,center);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(a[0],a[1],s===ref?4:3,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;frameSlider.value=frame;$('#frameText').textContent=`${frame+1} / ${comparison.frames}`;showMetrics()}
function showMetrics(){const box=$('#metrics');box.replaceChildren();for(const s of streams.slice(1)){const m=comparison.metrics[s.label]?.motion,add=(a,b)=>{const x=document.createElement('span');x.textContent=a;const y=document.createElement('span');y.textContent=b;box.append(x,y)};if(m){add(`${s.label} world MPJPE`,`${m.per_frame_world_mpjpe_cm[frame].toFixed(2)} cm`);add(`${s.label} root-relative`,`${m.per_frame_root_relative_mpjpe_cm[frame].toFixed(2)} cm`);add(`${s.label} rotation p95`,`${m.joint_rotation_degrees.p95.toFixed(2)}°`)}}}
async function load(c){comparison=await fetch(`/api/comparisons/${c.id}/comparison.json`).then(r=>{if(!r.ok)throw Error('comparison unavailable');return r.json()});$('#prompt').textContent=comparison.prompt;frame=0;frameSlider.max=comparison.frames-1;streams=await Promise.all(comparison.variants.map(async v=>({label:v.label,color:v.color,visible:true,root:new Float32Array(await fetch(`/api/comparisons/${comparison.id}/${v.label}/root_positions.f32`).then(r=>r.arrayBuffer())),rot:new Float32Array(await fetch(`/api/comparisons/${comparison.id}/${v.label}/local_rotations_xyzw.f32`).then(r=>r.arrayBuffer()))})));variantBox.replaceChildren(...streams.map(s=>{const l=document.createElement('label');l.className='variant';const i=document.createElement('input');i.type='checkbox';i.checked=true;i.onchange=()=>{s.visible=i.checked;draw()};const sw=document.createElement('span');sw.className='swatch';sw.style.background=s.color;l.append(i,sw,document.createTextNode(s.label+(s.label===comparison.reference?' (reference)':'')));return l}));$('#status').textContent=`${comparison.frames} frames · ${comparison.steps} steps · ${comparison.backend}`;draw()}
async function init(){try{cases=await fetch('/api/comparisons').then(r=>r.json());if(!cases.length)throw Error('No comparison artifacts found.');caseSelect.replaceChildren(...cases.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=`${c.id} — ${c.prompt}`;return o}));caseSelect.onchange=()=>load(cases.find(c=>c.id===caseSelect.value));await load(cases[0])}catch(e){$('#status').className='error';$('#status').textContent=e.message}}
function tick(t){if(comparison&&playing){if(!last)last=t;while(t-last>=1000/30){frame=(frame+1)%comparison.frames;last+=1000/30}draw()}requestAnimationFrame(tick)}$('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';last=performance.now()};frameSlider.oninput=()=>{frame=Number(frameSlider.value);playing=false;$('#play').textContent='Play';draw()};$('#alignment').onchange=draw;$('#opacity').oninput=draw;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=()=>drag=undefined;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(150,Math.min(1500,zoom*Math.exp(-e.deltaY*.001)));draw()};init();requestAnimationFrame(tick);
</script></body></html>
